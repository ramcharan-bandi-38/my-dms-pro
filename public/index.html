<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMS Prototype</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ROLE SIMULATOR BAR -->
    <div class="role-simulator">
        <label for="roleSelect"><strong>Current Logged-in Role:</strong></label>
        <select id="roleSelect">
            <option value="user">User (Student) - View & Download Only</option>
            <option value="sir">Sir (Teacher) - Upload & Message & Download</option>
            <option value="admin">Admin - Upload & Download & Join/Manage</option>
        </select>
    </div>

    <div class="app-container">
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <h2>📁 CloudCabinet</h2>
            <nav class="nav-menu">
                <a href="#" class="active">All Documents</a>
                <div id="sirFeatureSection" class="special-feature hidden">
                    <hr>
                    <p class="menu-label">Sir Tools</p>
                    <button id="btnMessage" class="btn-special">💬 Send Announcement</button>
                </div>
                <div id="adminFeatureSection" class="special-feature hidden">
                    <hr>
                    <p class="menu-label">Admin Tools</p>
                    <button id="btnJoin" class="btn-special">⚙️ Join Admin Panel</button>
                </div>
            </nav>
        </aside>

        <!-- MAIN WINDOW -->
        <main class="main-content">
            <!-- TOP CONTROLS -->
            <header class="top-bar">
                <input type="text" id="searchInput" placeholder="Search files...">
                
                <form id="uploadForm" class="upload-form">
                    <input type="file" id="fileInput" required>
                    <button type="submit" class="btn-upload">Upload File</button>
                </form>
            </header>

            <!-- DOCUMENT VIEWER -->
            <section class="dashboard-view">
                <h3>Document Library</h3>
                <div class="file-grid" id="fileGrid">
                    <!-- Dynamic cards inject here -->
                </div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
